name: Build lecture PDFs
on:
  push:
    branches: [main]
    paths: ['notes/**', 'evidence/**', 'verify_published.py', 'build_latex.py', 'latex-*.tex', 'latex-*.lua', 'requirements-latex.txt', '.github/workflows/build-pdf.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX, Pandoc and open CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended tex-gyre lmodern
          python -m pip install -r requirements-latex.txt
      - name: Validate and render all notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/pdf
          if [ -f evidence/source-verification.json ]; then
            python verify_published.py
          fi
          for source in notes/*.md; do
            python validate_markdown.py "$source"
            name="$(basename "$source" .md)"
            python build_latex.py "$source" "output/pdf/$name.pdf" --engine xelatex
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-pdfs
          path: |
            output/pdf/*.pdf
            output/pdf/*.verification.json
            output/pdf/*.tex
            output/pdf/*.log
          if-no-files-found: error
