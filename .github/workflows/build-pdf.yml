name: Build lecture PDFs
on:
  push:
    branches: [main]
    paths: ['notes/**', 'evidence/**', 'verify_published.py', 'md_to_pdf.py', 'requirements-pdf.txt', '.github/workflows/build-pdf.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          python -m pip install -r requirements-pdf.txt
      - name: Validate and render all notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/pdf
          if [ -f evidence/source-verification.json ]; then
            python verify_published.py
          fi
          for source in notes/*.md; do
            python validate_markdown.py "$source"
            name="$(basename "$source" .md)"
            python md_to_pdf.py "$source" "output/pdf/$name.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-pdfs
          path: |
            output/pdf/*.pdf
            output/pdf/*.verification.json
          if-no-files-found: error
